name: Build VideoFinder APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

- uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

- uses: android-actions/setup-android@v4

- name: Install Android SDK
    run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

- uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

- name: Extract project ZIP
    run: unzip VideoFinder-Android-Source.zip -d extracted

- name: Fix Java and Kotlin JVM targets
    run: |
      python3 - <<'PY'
      from pathlib import Path
      import re

      root = Path("extracted")
      files = list(root.rglob("build.gradle")) + list(root.rglob("build.gradle.kts"))
      app_files = [p for p in files if p.parent.name == "app"]

      if not app_files:
          raise SystemExit("File Gradle aplikasi tidak ditemukan")

      for p in app_files:
          s = p.read_text()
          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = re.sub(
              r'(sourceCompatibility|targetCompatibility)\s*=\s*["\']1\.8["\']',
              r'\1 = JavaVersion.VERSION_17',
              s
          )

          addition = """
      tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
          sourceCompatibility = "17"
          targetCompatibility = "17"
          options.release = 17
      }
      """
          if "options.release = 17" not in s:
              s += addition

          p.write_text(s)
          print(f"Updated: {p}")

      init_script = root / "align-jvm.gradle"
      init_script.write_text("""
      allprojects {
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
      }
      """)
      PY

- name: Build APK
    working-directory: extracted/VideoFinder
    run: gradle -I ../align-jvm.gradle assembleDebug

- uses: actions/upload-artifact@v4
    with:
      name: VideoFinder-debug-apk
      path: extracted/VideoFinder/app/build/outputs/apk/debug/app-debug.apk
