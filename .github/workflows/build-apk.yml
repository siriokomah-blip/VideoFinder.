
name: Build VideoFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip VideoFinder-Android-Source.zip -d extracted

      - name: Configure JVM targets
        run: |
          cat > /tmp/align-jvm.gradle <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }
              tasks.configureEach { task ->
                  if (task.name.toLowerCase().contains('kotlin') &&
                      task.hasProperty('kotlinOptions')) {
                      task.kotlinOptions.jvmTarget = '17'
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: |
          SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          gradle -I /tmp/align-jvm.gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoFinder-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
