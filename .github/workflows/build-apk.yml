
name: Build VideoFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check source ZIP
        run: |
          ls -la
          test -f VideoFinder-Android-Source.zip

      - name: Extract project ZIP
        run: unzip VideoFinder-Android-Source.zip -d extracted

      - name: Locate Gradle project
        run: |
          find extracted \( -name settings.gradle -o -name settings.gradle.kts \)
          find extracted \( -name build.gradle -o -name build.gradle.kts \)

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p extracted/VideoFinder assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoFinder-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
