
name: Build VideoFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
        
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip VideoFinder-Android-Source.zip -d extracted

      - name: Fix Java target
        run: |
          FILE=$(find extracted -type f \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) -print -quit)
          if [ -z "$FILE" ]; then
            echo "File konfigurasi Gradle aplikasi tidak ditemukan"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          echo "Memperbaiki: $FILE"
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$FILE"
          
      - name: Build APK
        working-directory: extracted/VideoFinder
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VideoFinder-debug-apk
          path: extracted/VideoFinder/app/build/outputs/apk/debug/app-debug.apk
